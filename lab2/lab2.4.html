<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 4</title>
</head>
<body>
    <h2>Завдання 4. Метод console.log()</h2>

    <script>
        let a = 17;
        let b = 5;

        console.log("Остача від ділення:", a % b);

        console.log("Остача дорівнює нулю:", a % b === 0);

        let arr = [10, 20, 30];

        console.log("Значення масиву: %d, %d, %d", arr[0], arr[1], arr[2]);

        console.log("Перший елемент масиву як рядок: %s", arr[0]);
    </script>
</body>
